<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>충암초등학교 칭찬게시판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cork:#c89a68; --cork-dark:#a97c4f; --cork-light:#d9b183; --frame:#7a5233;
    --ink:#2b3a55; --cream:#fbf4e6;
    --yellow:#ffd866; --coral:#ff7d6b; --sky:#6ec6e8; --mint:#8fd3a6; --lilac:#c9a6e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Gowun Dodum', sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.05) 0 2px, transparent 3px),
      radial-gradient(circle at 60% 70%, rgba(0,0,0,0.05) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0 2px, transparent 3px),
      radial-gradient(circle at 40% 85%, rgba(0,0,0,0.04) 0 2px, transparent 3px),
      linear-gradient(160deg, var(--cork-light), var(--cork) 45%, var(--cork-dark));
    background-size: 60px 60px, 80px 80px, 70px 70px, 90px 90px, cover;
    padding: 28px 16px 80px;
  }
  .frame{
    max-width: 980px; margin: 0 auto; border: 14px solid var(--frame); border-radius: 10px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35), inset 0 0 0 4px rgba(255,255,255,0.08);
    padding: 36px 28px 48px; position:relative;
  }
  header{ text-align:center; margin-bottom: 8px; }
  .logo-badge{
    width: 92px; height: 92px; margin: 0 auto 6px;
    border-radius: 50%;
    background: var(--cream);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.3), inset 0 0 0 3px var(--ink);
    overflow: hidden;
  }
  .eyebrow{
    display:inline-block; background: var(--ink); color: var(--cream); font-family:'Gaegu', sans-serif;
    font-weight:700; letter-spacing: 2px; font-size: 14px; padding: 5px 16px; border-radius: 999px;
    transform: rotate(-2deg); box-shadow: 0 4px 0 rgba(0,0,0,0.2);
  }
  h1{
    font-family:'Gaegu', sans-serif; font-weight:700; font-size: 52px; color: var(--cream);
    margin: 14px 0 4px; text-shadow: 3px 3px 0 rgba(0,0,0,0.25);
  }
  .squiggle{ display:block; margin: -6px auto 10px; width: 220px; }
  .subtitle{ color: var(--cream); font-size: 16px; opacity: 0.95; margin-bottom: 6px; }

  .session-bar{
    display:flex; justify-content:center; align-items:center; gap:10px; margin: 14px 0 0;
    font-family:'Gaegu', sans-serif; font-size:14px; color: var(--cream);
  }
  .session-bar button{
    background: var(--cream); color: var(--ink); border:none; font-family:'Gaegu', sans-serif;
    font-weight:700; font-size:13px; padding:5px 14px; border-radius:999px; cursor:pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }

  /* auth overlay */
  .auth-overlay{
    position: fixed; inset:0; background: rgba(20,15,8,0.55); display:flex; align-items:center;
    justify-content:center; z-index:1000; padding:20px;
  }
  .auth-card{
    background: var(--cream); width: 100%; max-width: 380px; border-radius: 6px; padding: 26px 22px 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4); position:relative; transform: rotate(-0.5deg);
  }
  .auth-card .pin{
    width: 20px; height:20px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff9a8f, var(--coral) 60%, #c94a3c);
    position:absolute; top:-12px; left:50%; transform:translateX(-50%); box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }
  .auth-card h2{ font-family:'Gaegu', sans-serif; font-size: 22px; text-align:center; margin: 6px 0 12px; }
  .auth-notice{
    background: rgba(110,198,232,0.18); border: 1px solid var(--sky); color: #205a75;
    font-size: 12.5px; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; line-height:1.5;
  }
  .auth-tabs{ display:flex; margin-bottom: 14px; border-bottom: 2px solid #e5d5b8; }
  .tab-btn{
    flex:1; padding:8px; background:none; border:none; font-family:'Gaegu', sans-serif; font-weight:700;
    font-size: 15px; color:#8a7a63; cursor:pointer;
  }
  .tab-btn.active{ color: var(--coral); border-bottom: 2px solid var(--coral); margin-bottom:-2px; }
  .auth-card label{ display:block; font-size: 13px; color:#6b5a44; margin: 10px 0 4px; }
  .auth-card input{
    width:100%; border:none; border-bottom: 2px dashed #d8c6a6; background:transparent;
    font-family:'Gowun Dodum', sans-serif; font-size:15px; padding:6px 2px; color:var(--ink);
  }
  .auth-card input:focus{ outline:none; border-bottom-color: var(--coral); }
  .auth-submit-btn{
    display:block; width:100%; margin: 18px 0 0; background: var(--coral); color:#fff; border:none;
    font-family:'Gaegu', sans-serif; font-weight:700; font-size:16px; padding:10px; border-radius:999px;
    cursor:pointer; box-shadow: 0 4px 0 #c94a3c;
  }
  .auth-submit-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 #c94a3c; }
  .auth-submit-btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .auth-hint{ font-size:12.5px; text-align:center; margin-top:10px; min-height:16px; color:#b3452f; }

  /* composer */
  .composer-wrap{ display:flex; justify-content:center; margin: 26px 0 40px; }
  .composer{
    background: var(--cream); width:100%; max-width:420px; padding: 22px 20px 18px; border-radius:4px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3); transform: rotate(-1deg); position:relative;
  }
  .composer.locked{ opacity:0.6; }
  .pin{
    width:20px; height:20px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff9a8f, var(--coral) 60%, #c94a3c);
    position:absolute; top:-12px; left:50%; transform:translateX(-50%); box-shadow: 0 3px 4px rgba(0,0,0,0.4);
  }
  .composer h2{ font-family:'Gaegu', sans-serif; font-size:22px; margin:4px 0 6px; text-align:center; }
  .composer .as-who{ text-align:center; font-size:12.5px; color:#8a7a63; margin-bottom:10px; }
  .composer label{ display:block; font-size:13px; color:#6b5a44; margin:10px 0 4px; }
  .composer input, .composer textarea{
    width:100%; border:none; border-bottom:2px dashed #d8c6a6; background:transparent;
    font-family:'Gowun Dodum', sans-serif; font-size:15px; padding:6px 2px; color:var(--ink); resize:vertical;
  }
  .composer input:focus, .composer textarea:focus{ outline:none; border-bottom-color: var(--coral); }
  .composer textarea{ min-height:64px; }
  .composer button.submit{
    display:block; margin:16px auto 0; background: var(--coral); color:#fff; border:none;
    font-family:'Gaegu', sans-serif; font-weight:700; font-size:16px; padding:10px 26px; border-radius:999px;
    cursor:pointer; box-shadow: 0 4px 0 #c94a3c;
  }
  .composer button.submit:disabled{ opacity:0.6; cursor:not-allowed; }
  .hint{ font-size:12px; color:#8a7a63; text-align:center; margin-top:8px; min-height:16px; }

  #board{ columns: 3 260px; column-gap: 22px; }
  @media (max-width: 640px){ #board{ columns: 1 260px; } }
  .card{
    break-inside:avoid; margin:0 0 22px; padding:20px 16px 16px; border-radius:3px; position:relative;
    box-shadow: 0 8px 14px rgba(0,0,0,0.25); transition: transform 0.2s ease, box-shadow 0.2s ease;
    font-size:14.5px; line-height:1.5;
  }
  .card:hover{ transform: rotate(0deg) translateY(-4px) scale(1.02); box-shadow: 0 14px 22px rgba(0,0,0,0.3); z-index:2; }
  .card .pin{ background: radial-gradient(circle at 35% 30%, #fff, var(--ink) 70%, #10192b); }
  .card .name{ font-family:'Gaegu', sans-serif; font-weight:700; font-size:19px; margin-bottom:2px; }
  .card .meta{ font-size:11.5px; color: rgba(43,58,85,0.7); margin-bottom:8px; }
  .card .content{ white-space:pre-wrap; word-break:break-word; }
  .card .footer{ margin-top:10px; font-size:12px; color:rgba(43,58,85,0.65); display:flex; justify-content:space-between; align-items:center; }
  .card .owner-actions button{
    background:none; border:1px solid rgba(43,58,85,0.3); border-radius:4px; font-size:11px; padding:2px 7px;
    cursor:pointer; color: var(--ink); margin-left:4px;
  }
  .card .owner-actions button.delete{ color:#b3452f; border-color:#e59a8b; }
  .card .report-btn{
    background:none; border:1px solid rgba(43,58,85,0.25); border-radius:4px; font-size:11px; padding:2px 7px;
    cursor:pointer; color: rgba(43,58,85,0.75);
  }
  .card .report-btn.reported{ opacity:0.5; cursor:default; }
  .card.yellow{ background: var(--yellow); } .card.coral{ background:#ffd2ca; }
  .card.sky{ background: var(--sky); } .card.mint{ background: var(--mint); } .card.lilac{ background: var(--lilac); }
  .empty-state{ text-align:center; color:var(--cream); font-family:'Gaegu', sans-serif; font-size:20px; padding:40px 10px; opacity:0.95; }
  .loading{ text-align:center; color:var(--cream); padding:30px; font-family:'Gaegu', sans-serif; }
  @media (prefers-reduced-motion: reduce){ .card, .composer button, .auth-submit-btn{ transition:none; } }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* admin panel */
  .admin-overlay{
    position: fixed; inset:0; background: rgba(20,15,8,0.6); display:none; align-items:flex-start;
    justify-content:center; z-index:1100; padding:24px 16px; overflow-y:auto;
  }
  .admin-overlay.open{ display:flex; }
  .admin-card{
    background: var(--cream); width:100%; max-width:640px; border-radius:8px; padding:24px 22px 28px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4); position:relative;
  }
  .admin-card h2{ font-family:'Gaegu', sans-serif; font-size:24px; margin-bottom:4px; }
  .admin-close{
    position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink);
  }
  .admin-section{ margin-top: 20px; }
  .admin-section h3{ font-family:'Gaegu', sans-serif; font-size:17px; margin-bottom:8px; color:var(--ink); }
  .admin-table{ width:100%; border-collapse: collapse; font-size:13.5px; }
  .admin-table th, .admin-table td{ text-align:left; padding:6px 8px; border-bottom:1px solid #e5d5b8; }
  .admin-table th{ color:#6b5a44; font-weight:700; }
  .admin-empty{ color:#8a7a63; font-size:13px; padding:8px 0; }
  .report-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #e5d5b8; }
  .report-row .rr-content{ font-size:13.5px; flex:1; }
  .report-row .rr-content .rr-target{ font-weight:700; }
  .report-row .rr-meta{ font-size:11.5px; color:#8a7a63; margin-top:2px; }
  .report-row .rr-actions{ display:flex; gap:6px; flex-shrink:0; }
  .report-row .rr-actions button{
    border:none; border-radius:4px; padding:4px 10px; font-size:12px; cursor:pointer;
  }
  .report-row .rr-actions button.dismiss{ background:#e5e0d3; color:var(--ink); }
  .report-row .rr-actions button.remove{ background: var(--coral); color:#fff; }
</style>

</head>

  let configOk = true;
  try{
    if(Object.values(firebaseConfig).some(v => !v || v.includes('여기에'))){
      configOk = false;
    }else{
      app = firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      functionsClient = app.functions('asia-northeast3'); // Cloud Function 리전과 반드시 동일해야 함
    }
  }catch(err){
    configOk = false;
    console.error('Firebase init failed:', err);
  }

  const board = document.getElementById('board');
  const sessionBar = document.getElementById('sessionBar');
  const form = document.getElementById('composerForm');
  const hint = document.getElementById('formHint');
  const asWho = document.getElementById('asWho');
  const submitBtn = document.getElementById('submitBtn');

  const authOverlay = document.getElementById('authOverlay');
  const authForm = document.getElementById('authForm');
  const authHint = document.getElementById('authHint');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const registerNameField = document.getElementById('registerNameField');

  const adminOverlay = document.getElementById('adminOverlay');
  const adminCloseBtn = document.getElementById('adminCloseBtn');
  const adminRoster = document.getElementById('adminRoster');
  const adminReports = document.getElementById('adminReports');
  const resetStudentId = document.getElementById('resetStudentId');
  const resetNewPw = document.getElementById('resetNewPw');
  const resetPwBtn = document.getElementById('resetPwBtn');
  const resetPwHint = document.getElementById('resetPwHint');

  resetPwBtn.addEventListener('click', async () => {
    const studentId = resetStudentId.value.trim();
    const newPassword = resetNewPw.value;
    if(!studentId || !newPassword){ resetPwHint.textContent = '학번과 새 비밀번호를 입력해 주세요.'; return; }
    if(newPassword.length < 6){ resetPwHint.textContent = '비밀번호는 6자 이상이어야 해요.'; return; }
    if(!confirm(`학번 ${studentId} 의 비밀번호를 재설정할까요?`)) return;

    resetPwBtn.disabled = true;
    resetPwHint.textContent = '처리 중...';
    try{
      const resetFn = functionsClient.httpsCallable('resetStudentPassword');
      await resetFn({ studentId, newPassword });
      resetPwHint.textContent = `학번 ${studentId} 비밀번호가 재설정됐어요.`;
      resetStudentId.value = '';
      resetNewPw.value = '';
    }catch(err){
      console.error('password reset failed:', err);
      resetPwHint.textContent = err.message || '재설정에 실패했어요.';
    }
    resetPwBtn.disabled = false;
  });

  let currentTab = 'login';
  let currentUser = null; // { uid, id, name, isAdmin }
  let praisesCache = [];

  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
  function idToEmail(id){ return `${id}@${EMAIL_DOMAIN}`; }

  if(!configOk){
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:#7a1f1f;color:#fff;text-align:center;padding:12px;font-family:'Gaegu',sans-serif;font-size:15px;">
        ⚠️ Firebase 설정이 비어 있어요. index.html의 firebaseConfig 값을 채워야 로그인/저장 기능이 동작합니다.
      </div>`);
  }

  function renderSessionBar(){
    if(currentUser){
      const adminBtn = currentUser.isAdmin ? `<button id="adminPanelBtn">관리자 패널</button>` : '';
      sessionBar.innerHTML = `<span>👋 ${escapeHtml(currentUser.name)}님 접속 중</span>${adminBtn}<button id="logoutBtn">로그아웃</button>`;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await auth.signOut();
      });
      if(currentUser.isAdmin){
        document.getElementById('adminPanelBtn').addEventListener('click', openAdminPanel);
      }
    }else{
      sessionBar.innerHTML = `<button id="loginAgainBtn">로그인 하기</button>`;
      document.getElementById('loginAgainBtn').addEventListener('click', () => { authOverlay.style.display = 'flex'; });
    }
  }

  function updateComposerState(){
    if(currentUser){
      form.classList.remove('locked');
      asWho.textContent = `${currentUser.name}님으로 작성합니다`;
      submitBtn.disabled = false;
    }else{
      form.classList.add('locked');
      asWho.textContent = '로그인하면 쪽지를 쓸 수 있어요';
      submitBtn.disabled = true;
    }
  }

  function setTab(tab){
    currentTab = tab;
    tabLogin.classList.toggle('active', tab === 'login');
    tabRegister.classList.toggle('active', tab === 'register');
    authSubmitBtn.textContent = tab === 'login' ? '로그인하기' : '회원가입하기';
    registerNameField.style.display = tab === 'register' ? 'block' : 'none';
    authHint.textContent = '';
  }
  tabLogin.addEventListener('click', () => setTab('login'));
  tabRegister.addEventListener('click', () => setTab('register'));

  function friendlyAuthError(code){
    switch(code){
      case 'auth/email-already-in-use': return '이미 가입된 학번이에요. 로그인 해주세요.';
      case 'auth/weak-password': return '비밀번호는 6자 이상으로 만들어 주세요.';
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found': return '학번 또는 비밀번호가 틀렸어요.';
      case 'auth/too-many-requests': return '너무 여러 번 시도했어요. 잠시 후 다시 해주세요.';
      default: return '오류가 발생했어요 (' + code + ')';
    }
  }

  authForm.addEventListener('submit', async function(e){
    e.preventDefault();
    if(!configOk){ authHint.textContent = 'Firebase 설정이 필요해요. 관리자에게 문의하세요.'; return; }
    const id = document.getElementById('modalId').value.trim();
    const pw = document.getElementById('modalPw').value;
    if(!id || !pw){ authHint.textContent = '학번과 비밀번호를 입력해 주세요.'; return; }
if(currentTab === 'register' && id.length !== 7){
  authHint.textContent = '아이디 형식이 잘못되었습니다.';
  return;}
    authSubmitBtn.disabled = true;
    authHint.textContent = '확인 중...'; const email = idToEmail(id);

    try{
      if(currentTab === 'register'){
        const name = document.getElementById('modalName').value.trim();
        if(!name){ authHint.textContent = '이름을 입력해 주세요.'; authSubmitBtn.disabled = false; return; }
        const cred = await auth.createUserWithEmailAndPassword(email, pw);
        const isAdmin = (id === ADMIN_ID);
        await db.collection('users').doc(cred.user.uid).set({
          studentId: id, name, isAdmin,
          registeredAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        // onAuthStateChanged will pick this up and finish login UI
      }else{
        await auth.signInWithEmailAndPassword(email, pw);
        // onAuthStateChanged will pick this up
      }
      authForm.reset();
    }catch(err){
      authHint.textContent = friendlyAuthError(err.code);
      authSubmitBtn.disabled = false;
    }
  });

  auth && auth.onAuthStateChanged(async (user) => {
    if(user){
      try{
        const doc = await db.collection('users').doc(user.uid).get();
        const data = doc.exists ? doc.data() : { studentId: '?', name: '사용자', isAdmin: false };
        currentUser = { uid: user.uid, id: data.studentId, name: data.name, isAdmin: !!data.isAdmin };
        authOverlay.style.display = 'none';
        authSubmitBtn.disabled = false;
      }catch(err){
        console.error('user profile load failed:', err);
      }
    }else{
      currentUser = null;
      authOverlay.style.display = 'flex';
    }
    renderSessionBar();
    updateComposerState();
    renderBoard();
  });

  function formatDate(ts){
    if(!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
  }
  function formatDateTime(ts){
    if(!ts) return '-';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  function seededRotation(id){
    let hash = 0;
    for(let i=0;i<id.length;i++){ hash = (hash*31 + id.charCodeAt(i)) % 1000; }
    return ((hash % 7) - 3);
  }

  function renderBoard(){
    if(!praisesCache || praisesCache.length === 0){
      board.innerHTML = '<div class="empty-state">아직 칭찬이 없어요!<br>첫 번째 칭찬 쪽지를 붙여보세요 🎉</div>';
      return;
    }
    board.innerHTML = praisesCache.map((item, idx) => {
      const color = colors[idx % colors.length];
      const rot = seededRotation(item.id || String(idx));
      const canDelete = currentUser && (currentUser.uid === item.authorId || currentUser.isAdmin);
      const reports = item.reports || [];
      const alreadyReported = currentUser && reports.includes(currentUser.uid);
      const canReport = currentUser && !currentUser.isAdmin && currentUser.uid !== item.authorId;
      return `<div class="card ${color}" style="transform: rotate(${rot}deg)" data-id="${item.id}">
        <div class="pin"></div>
        <div class="name">${escapeHtml(item.target)}</div>
        ${item.klass ? `<div class="meta">${escapeHtml(item.klass)}</div>` : ''}
        <div class="content">${escapeHtml(item.content)}</div>
        <div class="footer">
          <span>– ${item.authorName ? escapeHtml(item.authorName) : '누군가'} · ${formatDate(item.createdAt)}</span>
          <span class="owner-actions">
            ${canReport ? `<button class="report-btn ${alreadyReported ? 'reported' : ''}" data-action="report" data-id="${item.id}" ${alreadyReported ? 'disabled' : ''}>${alreadyReported ? '신고함' : '신고'}</button>` : ''}
            ${canDelete ? `<button class="delete" data-action="delete" data-id="${item.id}">삭제</button>` : ''}
          </span>
        </div>
      </div>`;
    }).join('');
  }

  board.addEventListener('click', async (e) => {
    const deleteBtn = e.target.closest('button[data-action="delete"]');
    if(deleteBtn){
      const id = deleteBtn.dataset.id;
      if(!confirm('이 칭찬 쪽지를 삭제할까요?')) return;
      await db.collection('praises').doc(id).delete();
      return;
    }
    const reportBtn = e.target.closest('button[data-action="report"]');
    if(reportBtn && currentUser){
      const id = reportBtn.dataset.id;
      await db.collection('praises').doc(id).update({
        reports: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
      });
    }
  });

  function startPraisesListener(){
    if(!configOk) return;
    db.collection('praises').orderBy('createdAt', 'desc').onSnapshot((snap) => {
      praisesCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBoard();
    }, (err) => {
      console.error('praises listener error:', err);
    });
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if(!currentUser){ authOverlay.style.display = 'flex'; return; }
    const target = document.getElementById('targetName').value.trim();
    const klass = document.getElementById('klass').value.trim();
    const content = document.getElementById('content').value.trim();
    if(!target || !content) return;

    submitBtn.disabled = true;
    hint.textContent = '붙이는 중...';
    try{
      await db.collection('praises').add({
        target, klass, content,
        authorId: currentUser.uid,
        authorName: currentUser.name,
        reports: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('targetName').value = '';
      document.getElementById('klass').value = '';
      document.getElementById('content').value = '';
      hint.textContent = '칭찬 쪽지가 붙었어요! 🎉';
    }catch(err){
      console.error('add praise failed:', err);
      hint.textContent = '저장에 실패했어요. 다시 시도해 주세요.';
    }
    submitBtn.disabled = false;
    setTimeout(()=>{ hint.textContent=''; }, 2500);
  });

  async function openAdminPanel(){
    adminOverlay.classList.add('open');
    await renderAdminRoster();
    renderAdminReports();
  }
  adminCloseBtn.addEventListener('click', () => adminOverlay.classList.remove('open'));

  async function renderAdminRoster(){
    adminRoster.innerHTML = '<div class="admin-empty">불러오는 중...</div>';
    try{
      const snap = await db.collection('users').orderBy('registeredAt', 'asc').get();
      const rows = snap.docs.map(d => d.data()).filter(u => !u.isAdmin);
      if(rows.length === 0){
        adminRoster.innerHTML = '<div class="admin-empty">아직 가입한 학생이 없어요.</div>';
        return;
      }
      adminRoster.innerHTML = `<table class="admin-table"><thead><tr><th>학번</th><th>이름</th><th>가입일</th></tr></thead><tbody>
        ${rows.map(u => `<tr><td>${escapeHtml(u.studentId)}</td><td>${escapeHtml(u.name)}</td><td>${formatDateTime(u.registeredAt)}</td></tr>`).join('')}
      </tbody></table>`;
    }catch(err){
      console.error('roster load failed:', err);
      adminRoster.innerHTML = '<div class="admin-empty">명단을 불러오지 못했어요.</div>';
    }
  }

  function renderAdminReports(){
    const reported = praisesCache.filter(p => p.reports && p.reports.length > 0)
      .sort((a,b) => (b.reports.length - a.reports.length));
    if(reported.length === 0){
      adminReports.innerHTML = '<div class="admin-empty">신고된 글이 없어요.</div>';
      return;
    }
    adminReports.innerHTML = reported.map(item => `
      <div class="report-row" data-id="${item.id}">
        <div class="rr-content">
          <span class="rr-target">${escapeHtml(item.target)}</span> 앞 쪽지 · 🚩 신고 ${item.reports.length}건<br>
          ${escapeHtml(item.content)}
          <div class="rr-meta">작성자: ${escapeHtml(item.authorName || '알 수 없음')} · ${formatDate(item.createdAt)}</div>
        </div>
        <div class="rr-actions">
          <button type="button" class="dismiss" data-action="dismiss-report" data-id="${item.id}">신고 무시</button>
          <button type="button" class="remove" data-action="admin-delete" data-id="${item.id}">글 삭제</button>
        </div>
      </div>`).join('');
  }

  adminReports.addEventListener('click', async (e) => {
    const dismissBtn = e.target.closest('button[data-action="dismiss-report"]');
    const deleteBtn = e.target.closest('button[data-action="admin-delete"]');
    if(dismissBtn){
      const id = dismissBtn.dataset.id;
      await db.collection('praises').doc(id).update({ reports: [] });
      renderAdminReports();
    }else if(deleteBtn){
      const id = deleteBtn.dataset.id;
      if(!confirm('이 칭찬 쪽지를 삭제할까요?')) return;
      await db.collection('praises').doc(id).delete();
      renderAdminReports();
    }
  });

  renderSessionBar();
  updateComposerState();
  startPraisesListener();
})();
</script>
</body>
</html>
